name: Build Alpha Chama APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable signed APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Alpha_Chama_Member_Installable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alpha_Chama_Member_Installable_APK
          path: Alpha_Chama_Member_Installable.apk
          if-no-files-found: error
